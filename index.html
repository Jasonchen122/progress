<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開辦進度表</title>
<meta name="apple-mobile-web-app-title" content="開辦進度表">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#0F3D33;color:#fff;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;text-align:center}
  img{width:120px;height:120px;border-radius:26px;margin-bottom:20px}
  a{display:inline-block;margin-top:18px;padding:14px 28px;border-radius:999px;background:#FFC94A;color:#0F3D33;
    font-weight:700;text-decoration:none;font-size:18px}
  p{opacity:.8;margin:0}
</style>
</head>
<body>
  <img src="apple-touch-icon.png" alt="">
  <p>正在開啟開辦進度表…</p>
  <a id="go" href="https://claude.ai/artifact/FjcMQvqqMjjXAgCu978Q8y">沒有自動跳轉？點這裡</a>
<script>
  // 從主畫面圖示開啟時自動跳到進度表；在一般瀏覽時（例如剛要加入主畫面）先停留，方便加入主畫面
  var target = document.getElementById('go').href;
  var fromHomeScreen = window.navigator.standalone === true ||
                       window.matchMedia('(display-mode: standalone)').matches ||
                       location.hash === '#go';
  if (fromHomeScreen) {
    location.replace(target);
  }
</script>
</body>
</html>
